OUT_DIR: "./exp/resnet18-test/"
SEED: 1029
IMAGENET_LOADER:
  data_path: "/data/ImageNet/"

ARCH:
  name: "resnet18"

QUANT_PARAM:
  wq:
    channel_wise: True
    scale_method: "mse"
  aq:
    channel_wise: False
    scale_method: "mse"
  act_quant: True
  disable_8bit_head_stem: False

W_CALIBRATION_PARAM:
  num_samples: 1024
  iters_w: 30000
  wlr: 1.e-3
  weight: 0.01
  sym: True
  b_start: 20
  b_end: 2
  warmup: 0.25
  mini_batch: 32
  opt_mode: "mse"
  wwq: True
  waq: True
  keep_gpu: True
A_CALIBRATION_PARAM:
  lr: 4.e-5
  awq: True
  aaq: True

# order parameters
ORDER_PARAM:
  order: "together"
  prob: 0.5
  input_prob: 0.5

group:
  H: [7, 8]
  M: [5, 6]
  L: [3, 4]
MIXUP_PARAM: [0.3, 0.3, 0.4]
GDLOSS: True
GDLOSS_PARAM: [0.6, 0.2, 0.2]
